<section class="jobs container container--lg">
  <app-jobs-filters
    [filter]="jobsStore.filter()"
    (searchClicked)="
      this.router.navigate(['/jobs'], {
        queryParams: $event,
        queryParamsHandling: 'merge',
      })
    "
  />

  <app-jobs-list
    [jobs]="jobsStore.visibleJobs()"
    [hasMore]="jobsStore.hasMore()"
    (loadMoreClicked)="onLoadMore()"
  />
</section>
