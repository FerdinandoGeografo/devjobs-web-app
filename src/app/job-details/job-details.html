@let job = detailsStore.job();

<section class="job container container--md">
  @if (detailsStore.loading()) {
    <app-loader-box />
  } @else if (detailsStore.notFound()) {
    <app-empty-box emptyMessage="No job found. Please retry..." />
  } @else {
    <app-job-details-header [job]="job!" />
    <app-job-details-content [job]="job!" />
  }
</section>

@if (job) {
  <app-job-details-footer
    [position]="job!.position"
    [company]="job!.company"
    [apply]="job!.apply"
  />
}
