@let job = detailsStore.job();

<section class="job container container--md">
  @if (job === null) {
    <p>No job found with id: {{ id() }}</p>
  } @else {
    <app-job-details-header [job]="job!" />
    <app-job-details-content [job]="job!" />
  }
</section>

@if (job) {
  <app-job-details-footer
    [position]="job!.position"
    [company]="job!.company"
    [apply]="job!.apply"
  />
}
