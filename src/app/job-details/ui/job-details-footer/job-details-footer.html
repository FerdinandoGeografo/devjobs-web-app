<div animate.enter="animate animate--fade-in-bottom" class="footer__content">
  <div class="footer__text">
    <h2 class="heading heading--md">{{ position() }}</h2>
    <p class="text">{{ company() }}</p>
  </div>
  <a
    class="btn btn--primary"
    matButton="filled"
    [href]="apply()"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Apply on company's website"
  >
    Apply Now
  </a>
</div>
