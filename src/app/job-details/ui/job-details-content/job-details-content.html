<article class="job">
  <div class="job__heading-box">
    <div class="job__text">
      <div class="job__data">
        <p class="text">{{ job().postedAt }}</p>
        <div aria-hidden="true"></div>
        <p class="text">{{ job().contract }}</p>
      </div>
      <h1 class="job__position heading heading--xl">{{ job().position }}</h1>
      <p class="job__location heading heading--sm">{{ job().location }}</p>
    </div>
    <a
      class="btn btn--primary"
      matButton="filled"
      [href]="job().apply"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Apply job on company's website"
    >
      Apply Now
    </a>
  </div>

  <p class="text">
    {{ job().description }}
  </p>

  <app-job-details-list title="Requirements" [jobMetadata]="job().requirements" />
  <app-job-details-list title="What You Will Do" [jobMetadata]="job().role" bulletMode="numeric" />
</article>
